global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    environment: local
    project: autoheal

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: autoheal-api
    metrics_path: /api/v1/metrics
    static_configs:
      - targets:
          - api:8000
