global:
  resolve_timeout: 1m

route:
  receiver: autoheal-default
  group_by:
    - alertname
    - service
    - severity
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h
  routes:
    - matchers:
        - severity = "critical"
      receiver: autoheal-critical
      group_wait: 5s
      repeat_interval: 30m
    - matchers:
        - severity = "warning"
      receiver: autoheal-warning
      group_wait: 15s
      repeat_interval: 1h

inhibit_rules:
  - source_matchers:
      - alertname = "AutoHealServiceDown"
      - severity = "critical"
    target_matchers:
      - severity = "warning"
      - component =~ "target-service|monitoring"
    equal:
      - service

  - source_matchers:
      - alertname = "AutoHealApiDown"
      - severity = "critical"
    target_matchers:
      - alertname = "AutoHealApiServerErrors"
      - severity = "warning"

receivers:
  - name: autoheal-default
  - name: autoheal-critical
    # Add webhook_configs, slack_configs, or email_configs via an untracked
    # local override pointed to by ALERTMANAGER_CONFIG_FILE in .env.
  - name: autoheal-warning

