
user root;
worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    default_type application/json;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    client_body_temp_path /tmp/nginx_client_temp;
    proxy_temp_path /tmp/nginx_proxy_temp;
    fastcgi_temp_path /tmp/nginx_fastcgi_temp;
    uwsgi_temp_path /tmp/nginx_uwsgi_temp;
    scgi_temp_path /tmp/nginx_scgi_temp;

    upstream docker_socket {
        server unix:/var/run/docker.sock;
    }

    server {
        listen 2375;
        server_name _;
        server_tokens off;

        client_max_body_size 1k;
        client_body_timeout 5s;
        client_header_timeout 5s;
        send_timeout 10s;
        merge_slashes off;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Upgrade "";
        proxy_request_buffering on;

        # Reject traversal, encoded characters, duplicate slashes and semicolons.
        if ($request_uri ~* "(\.\.|//|%|\\|;)") {
            return 403 '{"message":"Forbidden by AutoHeal restricted Docker socket proxy"}\n';
        }

        # Docker ping: GET only, no query parameters.
        location = /_ping {
            limit_except GET {
                deny all;
            }

            if ($args != "") {
                return 403;
            }

            proxy_pass http://docker_socket;
        }

        # Docker version metadata: GET only, no query parameters.
        location ~ ^(/v[1-9][0-9]*\.[0-9]+)?/version$ {
            limit_except GET {
                deny all;
            }

            if ($args != "") {
                return 403;
            }

            proxy_pass http://docker_socket;
        }

        # Inspect only the approved container: GET, no query parameters.
        location ~ ^(/v[1-9][0-9]*\.[0-9]+)?/containers/autoheal-web/json$ {
            limit_except GET {
                deny all;
            }

            if ($args != "") {
                return 403;
            }

            proxy_pass http://docker_socket;
        }

        # Restart only the approved container using a bounded timeout.
        location ~ ^(/v[1-9][0-9]*\.[0-9]+)?/containers/autoheal-web/restart$ {
            limit_except POST {
                deny all;
            }

            if ($args !~ "^(t=([0-9]|[1-9][0-9]|1[01][0-9]|120))?$") {
                return 403;
            }

            proxy_pass http://docker_socket;
            proxy_read_timeout 60s;
        }

        # Start only the approved container, without query parameters.
        location ~ ^(/v[1-9][0-9]*\.[0-9]+)?/containers/autoheal-web/start$ {
            limit_except POST {
                deny all;
            }

            if ($args != "") {
                return 403;
            }

            proxy_pass http://docker_socket;
            proxy_read_timeout 60s;
        }

        # Deny all other Docker API endpoints.
        location / {
            return 403 '{"message":"Forbidden by AutoHeal restricted Docker socket proxy"}\n';
        }
    }
}
