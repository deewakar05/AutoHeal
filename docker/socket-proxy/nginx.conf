user root;
worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    default_type application/json;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    client_body_temp_path /tmp/nginx_client_temp;
    proxy_temp_path /tmp/nginx_proxy_temp;
    fastcgi_temp_path /tmp/nginx_fastcgi_temp;
    uwsgi_temp_path /tmp/nginx_uwsgi_temp;
    scgi_temp_path /tmp/nginx_scgi_temp;

    upstream docker_socket {
        server unix:/var/run/docker.sock;
    }

    server {
        listen 2375;
        server_name _;
        server_tokens off;
        client_max_body_size 1k;
        client_body_timeout 5s;
        client_header_timeout 5s;
        send_timeout 10s;
        merge_slashes off;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Upgrade "";
        proxy_request_buffering on;

        # Reject path traversal, encoded characters, duplicate slashes, semicolons, and query strings
        if ($request_uri ~* "(\.\.|//|%|\\|;|\?)") {
            return 403 '{"message":"Forbidden by AutoHeal restricted Docker socket proxy"}\n';
        }

        # Docker CLI ping check (HEAD) and proxy healthcheck (GET)
        location = /_ping {
            limit_except GET {
                deny all;
            }
            proxy_pass http://docker_socket;
        }

        # Docker CLI version negotiation (read-only engine version metadata)
        location ~ ^(/v[1-9][0-9]*\.[0-9]+)?/version$ {
            if ($request_method != GET) {
                return 403 '{"message":"Forbidden method on restricted Docker socket proxy"}\n';
            }
            proxy_pass http://docker_socket;
        }

        # Read-only inspect for the single approved target container: autoheal-web
        location ~ ^(/v[1-9][0-9]*\.[0-9]+)?/containers/autoheal-web/json$ {
            if ($request_method != GET) {
                return 403 '{"message":"Forbidden method on restricted Docker socket proxy"}\n';
            }
            proxy_pass http://docker_socket;
        }

        # Explicitly allow ONLY POST restart and start for autoheal-web
        location ~ ^(/v[1-9][0-9]*\.[0-9]+)?/containers/autoheal-web/(restart|start)$ {
            limit_except POST {
                deny all;
            }
            proxy_pass http://docker_socket;
            proxy_read_timeout 60s;
        }

        # Deny everything else: container creation, exec, images, volumes, networks, system, etc.
        location / {
            return 403 '{"message":"Forbidden by AutoHeal restricted Docker socket proxy"}\n';
        }
    }
}
