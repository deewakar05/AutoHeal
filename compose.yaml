services:
  web:
    image: nginx:alpine
    container_name: autoheal-web
    ports:
      - "8080:80"
    volumes:
      - ./app/html:/usr/share/nginx/html:ro
      - ./app/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - autoheal-net

  ansible:
    build:
      context: .
      dockerfile: docker/ansible.Dockerfile
    container_name: autoheal-ansible
    working_dir: /workspace/ansible
    volumes:
      - ./:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - autoheal-net

networks:
  autoheal-net:
    driver: bridge