
services:
  web:
    image: nginx:alpine
    container_name: autoheal-web
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./app/html:/usr/share/nginx/html:ro
      - ./app/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /run
      - /var/cache/nginx
      - /tmp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    mem_limit: 64m
    cpus: "0.25"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - autoheal-network

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: autoheal-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      API_PORT: "${API_PORT:-8000}"
      AUTOHEAL_DB_PATH: "${AUTOHEAL_DB_PATH:-/data/autoheal.db}"
      AUTOHEAL_REMEDIATION_ENABLED: "${AUTOHEAL_REMEDIATION_ENABLED:-false}"
      AUTOHEAL_REMEDIATION_DRY_RUN: "${AUTOHEAL_REMEDIATION_DRY_RUN:-true}"
      AUTOHEAL_REMEDIATION_COOLDOWN_SECONDS: "${AUTOHEAL_REMEDIATION_COOLDOWN_SECONDS:-300}"
      AUTOHEAL_REMEDIATION_MAX_ATTEMPTS: "${AUTOHEAL_REMEDIATION_MAX_ATTEMPTS:-3}"
      AUTOHEAL_REMEDIATION_TIMEOUT_SECONDS: "${AUTOHEAL_REMEDIATION_TIMEOUT_SECONDS:-120}"
      AUTOHEAL_REMEDIATION_STALE_TIMEOUT_SECONDS: "${AUTOHEAL_REMEDIATION_STALE_TIMEOUT_SECONDS:-180}"
      AUTOHEAL_REMEDIATION_MAX_CONCURRENCY: "${AUTOHEAL_REMEDIATION_MAX_CONCURRENCY:-1}"
      AUTOHEAL_ALLOWED_SERVICES: "${AUTOHEAL_ALLOWED_SERVICES:-web}"
      AUTOHEAL_ALLOWED_ACTIONS: "${AUTOHEAL_ALLOWED_ACTIONS:-restart}"
      AUTOHEAL_REMEDIATION_VERIFY_INTERVAL: "${AUTOHEAL_REMEDIATION_VERIFY_INTERVAL:-5}"
      AUTOHEAL_REMEDIATION_VERIFY_ATTEMPTS: "${AUTOHEAL_REMEDIATION_VERIFY_ATTEMPTS:-6}"
      AUTOHEAL_REMEDIATION_VERIFY_REQUIRED_SUCCESSES: "${AUTOHEAL_REMEDIATION_VERIFY_REQUIRED_SUCCESSES:-2}"
      AUTOHEAL_REMEDIATION_VERIFY_TARGET_URL: "${AUTOHEAL_REMEDIATION_VERIFY_TARGET_URL:-http://web/health}"
      AUTOHEAL_REMEDIATION_DISPATCH_MODE: "${AUTOHEAL_REMEDIATION_DISPATCH_MODE:-queue}"
      AUTOHEAL_NAGIOS_ENABLED: "${AUTOHEAL_NAGIOS_ENABLED:-true}"
      AUTOHEAL_NAGIOS_WEBHOOK_SECRET: "${AUTOHEAL_NAGIOS_WEBHOOK_SECRET:-}"
      AUTOHEAL_NAGIOS_SERVICE_MAP: "${AUTOHEAL_NAGIOS_SERVICE_MAP:-}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    volumes:
      - ./api/src:/app/api/src:ro
      - ./remediation/src:/app/remediation/src:ro
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: "0.50"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      web:
        condition: service_healthy
    networks:
      - autoheal-network

  docker-socket-proxy:
    build:
      context: .
      dockerfile: docker/socket-proxy/Dockerfile
    container_name: autoheal-socket-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 64m
    cpus: "0.25"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2375/_ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - autoheal-control-network

  remediation-executor:
    build:
      context: .
      dockerfile: docker/ansible.Dockerfile
    container_name: autoheal-remediation-executor
    environment:
      AUTOHEAL_DB_PATH: "${AUTOHEAL_DB_PATH:-/data/autoheal.db}"
      DOCKER_HOST: "tcp://docker-socket-proxy:2375"
      AUTOHEAL_REMEDIATION_ENABLED: "${AUTOHEAL_REMEDIATION_ENABLED:-false}"
      AUTOHEAL_REMEDIATION_DRY_RUN: "${AUTOHEAL_REMEDIATION_DRY_RUN:-true}"
      AUTOHEAL_REMEDIATION_COOLDOWN_SECONDS: "${AUTOHEAL_REMEDIATION_COOLDOWN_SECONDS:-300}"
      AUTOHEAL_REMEDIATION_MAX_ATTEMPTS: "${AUTOHEAL_REMEDIATION_MAX_ATTEMPTS:-3}"
      AUTOHEAL_REMEDIATION_TIMEOUT_SECONDS: "${AUTOHEAL_REMEDIATION_TIMEOUT_SECONDS:-120}"
      AUTOHEAL_REMEDIATION_STALE_TIMEOUT_SECONDS: "${AUTOHEAL_REMEDIATION_STALE_TIMEOUT_SECONDS:-180}"
      AUTOHEAL_REMEDIATION_MAX_CONCURRENCY: "${AUTOHEAL_REMEDIATION_MAX_CONCURRENCY:-1}"
      AUTOHEAL_ALLOWED_SERVICES: "${AUTOHEAL_ALLOWED_SERVICES:-web}"
      AUTOHEAL_ALLOWED_ACTIONS: "${AUTOHEAL_ALLOWED_ACTIONS:-restart}"
      AUTOHEAL_REMEDIATION_VERIFY_INTERVAL: "${AUTOHEAL_REMEDIATION_VERIFY_INTERVAL:-5}"
      AUTOHEAL_REMEDIATION_VERIFY_ATTEMPTS: "${AUTOHEAL_REMEDIATION_VERIFY_ATTEMPTS:-6}"
      AUTOHEAL_REMEDIATION_VERIFY_REQUIRED_SUCCESSES: "${AUTOHEAL_REMEDIATION_VERIFY_REQUIRED_SUCCESSES:-2}"
      AUTOHEAL_REMEDIATION_VERIFY_TARGET_URL: "${AUTOHEAL_REMEDIATION_VERIFY_TARGET_URL:-http://web/health}"
      AUTOHEAL_REMEDIATION_EXECUTOR_POLL_INTERVAL: "${AUTOHEAL_REMEDIATION_EXECUTOR_POLL_INTERVAL:-1}"
      AUTOHEAL_REMEDIATION_EXECUTOR_HEARTBEAT_PATH: "/tmp/executor.heartbeat"
      AUTOHEAL_REMEDIATION_WORKSPACE_ROOT: "/workspace"
      AUTOHEAL_REMEDIATION_REQUIRE_ISOLATION: "${AUTOHEAL_REMEDIATION_REQUIRE_ISOLATION:-true}"
      AUTOHEAL_REMEDIATION_DISPATCH_MODE: "${AUTOHEAL_REMEDIATION_DISPATCH_MODE:-queue}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    volumes:
      - ./remediation/src:/workspace/remediation/src:ro
      - ./remediation/recover.yml:/workspace/remediation/recover.yml:ro
      - ./ansible:/workspace/ansible:ro
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import os, time, sys; p=os.getenv('AUTOHEAL_REMEDIATION_EXECUTOR_HEARTBEAT_PATH','/tmp/executor.heartbeat'); max_age=float(os.getenv('AUTOHEAL_REMEDIATION_EXECUTOR_POLL_INTERVAL','1'))*10+15; sys.exit(0 if os.path.exists(p) and (time.time()-os.path.getmtime(p))<max_age else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    networks:
      - autoheal-network
      - autoheal-control-network

  monitor:
    build:
      context: .
      dockerfile: docker/monitor.Dockerfile
    container_name: autoheal-monitor
    environment:
      AUTOHEAL_DB_PATH: "${AUTOHEAL_DB_PATH:-/data/autoheal.db}"

      MONITOR_ENABLED: "${MONITOR_ENABLED:-true}"
      MONITOR_TARGET_URL: "${MONITOR_TARGET_URL:-http://web/health}"
      MONITOR_TARGET_SERVICE: "${MONITOR_TARGET_SERVICE:-web}"
      MONITOR_INTERVAL: "${MONITOR_INTERVAL:-5}"
      MONITOR_TIMEOUT: "${MONITOR_TIMEOUT:-3}"
      MONITOR_FAILURE_THRESHOLD: "${MONITOR_FAILURE_THRESHOLD:-3}"
      MONITOR_RECOVERY_THRESHOLD: "${MONITOR_RECOVERY_THRESHOLD:-2}"
      HEARTBEAT_PATH: "/tmp/monitor.heartbeat"

      NAGIOS_MONITOR_ENABLED: "${NAGIOS_MONITOR_ENABLED:-true}"
      NAGIOS_STATUS_URL: "${NAGIOS_STATUS_URL:-http://nagios:8081/nagios4/cgi-bin/statusjson.cgi?query=programstatus}"
      NAGIOS_ADMIN_USER: "${NAGIOS_ADMIN_USER:-nagiosadmin}"
      NAGIOS_ADMIN_PASSWORD: "${NAGIOS_ADMIN_PASSWORD:-}"
      NAGIOS_PROBE_TIMEOUT: "${NAGIOS_PROBE_TIMEOUT:-3}"

      AUTOHEAL_REMEDIATION_ENABLED: "${AUTOHEAL_REMEDIATION_ENABLED:-false}"
      AUTOHEAL_REMEDIATION_DRY_RUN: "${AUTOHEAL_REMEDIATION_DRY_RUN:-true}"
      AUTOHEAL_REMEDIATION_COOLDOWN_SECONDS: "${AUTOHEAL_REMEDIATION_COOLDOWN_SECONDS:-300}"
      AUTOHEAL_REMEDIATION_MAX_ATTEMPTS: "${AUTOHEAL_REMEDIATION_MAX_ATTEMPTS:-3}"
      AUTOHEAL_REMEDIATION_TIMEOUT_SECONDS: "${AUTOHEAL_REMEDIATION_TIMEOUT_SECONDS:-120}"
      AUTOHEAL_REMEDIATION_STALE_TIMEOUT_SECONDS: "${AUTOHEAL_REMEDIATION_STALE_TIMEOUT_SECONDS:-180}"
      AUTOHEAL_REMEDIATION_MAX_CONCURRENCY: "${AUTOHEAL_REMEDIATION_MAX_CONCURRENCY:-1}"
      AUTOHEAL_ALLOWED_SERVICES: "${AUTOHEAL_ALLOWED_SERVICES:-web}"
      AUTOHEAL_ALLOWED_ACTIONS: "${AUTOHEAL_ALLOWED_ACTIONS:-restart}"
      AUTOHEAL_REMEDIATION_VERIFY_INTERVAL: "${AUTOHEAL_REMEDIATION_VERIFY_INTERVAL:-5}"
      AUTOHEAL_REMEDIATION_VERIFY_ATTEMPTS: "${AUTOHEAL_REMEDIATION_VERIFY_ATTEMPTS:-6}"
      AUTOHEAL_REMEDIATION_VERIFY_REQUIRED_SUCCESSES: "${AUTOHEAL_REMEDIATION_VERIFY_REQUIRED_SUCCESSES:-2}"
      AUTOHEAL_REMEDIATION_VERIFY_TARGET_URL: "${AUTOHEAL_REMEDIATION_VERIFY_TARGET_URL:-http://web/health}"
      AUTOHEAL_REMEDIATION_DISPATCH_MODE: "${AUTOHEAL_REMEDIATION_DISPATCH_MODE:-queue}"

      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    volumes:
      - ./remediation/src:/workspace/remediation/src:ro
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: "0.25"
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time,sys; p='/tmp/monitor.heartbeat'; age=float(os.getenv('MONITOR_INTERVAL','5'))*3+15; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<age else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s
    depends_on:
      web:
        condition: service_started
      nagios:
        condition: service_started
    networks:
      - autoheal-network

  nagios:
    build:
      context: .
      dockerfile: docker/nagios/Dockerfile
    container_name: autoheal-nagios
    init: true
    ports:
      - "${NAGIOS_PORT:-8081}:8081"
    environment:
      NAGIOS_ADMIN_USER: "${NAGIOS_ADMIN_USER:-nagiosadmin}"
      NAGIOS_ADMIN_PASSWORD: "${NAGIOS_ADMIN_PASSWORD:-}"
      AUTOHEAL_NAGIOS_WEBHOOK_SECRET: "${AUTOHEAL_NAGIOS_WEBHOOK_SECRET:-}"
      AUTOHEAL_API_NAGIOS_URL: "http://api:8000/api/v1/monitoring/nagios/alerts"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    volumes:
      - nagios-data:/var/lib/nagios4
      - ./nagios/etc:/opt/nagios/etc:ro
      - ./nagios/scripts:/opt/nagios/scripts:ro
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: "0.50"
    healthcheck:
      test: ["CMD", "/usr/lib/nagios/plugins/check_http", "-H", "127.0.0.1", "-p", "8081", "-u", "/nagios4/", "-e", "401", "-t", "3"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - autoheal-network

volumes:
  nagios-data:

networks:
  autoheal-network:
    name: autoheal-network
    driver: bridge
  autoheal-control-network:
    name: autoheal-control-network
    driver: bridge
    internal: true
