services:
  web:
    image: nginx:alpine
    container_name: autoheal-web
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./app/html:/usr/share/nginx/html:ro
      - ./app/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - autoheal-network

  monitor:
    build:
      context: .
      dockerfile: monitoring/Dockerfile
    container_name: autoheal-monitor
    environment:
      MONITOR_ENABLED: "${MONITOR_ENABLED:-true}"
      MONITOR_TARGET_URL: "${MONITOR_TARGET_URL:-http://web/health}"
      MONITOR_TARGET_SERVICE: "${MONITOR_TARGET_SERVICE:-web}"
      MONITOR_INTERVAL: "${MONITOR_INTERVAL:-5}"
      MONITOR_TIMEOUT: "${MONITOR_TIMEOUT:-3}"
      MONITOR_FAILURE_THRESHOLD: "${MONITOR_FAILURE_THRESHOLD:-3}"
      MONITOR_RECOVERY_THRESHOLD: "${MONITOR_RECOVERY_THRESHOLD:-2}"
      AUTOHEAL_DB_PATH: "${AUTOHEAL_DB_PATH:-/data/autoheal.db}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    volumes:
      - ./monitoring/src:/app/src:ro
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      web:
        condition: service_healthy
    networks:
      - autoheal-network

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: autoheal-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      API_PORT: "${API_PORT:-8000}"
      MONITOR_ENABLED: "${MONITOR_ENABLED:-true}"
      MONITOR_TARGET_URL: "${MONITOR_TARGET_URL:-http://web/health}"
      MONITOR_TARGET_SERVICE: "${MONITOR_TARGET_SERVICE:-web}"
      AUTOHEAL_DB_PATH: "${AUTOHEAL_DB_PATH:-/data/autoheal.db}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    volumes:
      - ./api/src:/app/src:ro
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      web:
        condition: service_healthy
      monitor:
        condition: service_healthy
    networks:
      - autoheal-network

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: autoheal-alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - "${ALERTMANAGER_CONFIG_FILE:-./observability/alertmanager/alertmanager.yml}:/etc/alertmanager/alertmanager.yml:ro"
      - alertmanager-data:/alertmanager
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - autoheal-network

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: autoheal-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
    networks:
      - autoheal-network

  grafana:
    image: grafana/grafana:11.6.0
    container_name: autoheal-grafana
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_LOG_MODE: "console"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    read_only: true
    tmpfs:
      - /tmp
      - /var/log/grafana
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - autoheal-network

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:

networks:
  autoheal-network:
    name: autoheal-network
    driver: bridge
