# Main Nagios Core Configuration for AutoHeal (read-only rootfs safe, non-root)

log_file=/tmp/nagios4/nagios.log
log_archive_path=/tmp/nagios4/archives
object_cache_file=/var/lib/nagios4/objects.cache
precached_object_file=/var/lib/nagios4/objects.precache
resource_file=/opt/nagios/etc/resource.cfg
status_file=/var/lib/nagios4/status.dat
status_update_interval=5
nagios_user=nagios
nagios_group=nagios
check_external_commands=1
command_file=/var/lib/nagios4/rw/nagios.cmd
lock_file=/tmp/nagios4/nagios4.pid
temp_file=/tmp/nagios4/nagios.tmp
temp_path=/tmp/nagios4/tmp
check_result_path=/tmp/nagios4/spool/checkresults
max_check_result_reaper_time=30
check_result_reaper_frequency=5
state_retention_file=/var/lib/nagios4/retention.dat
retain_state_information=1
retention_update_interval=5
use_retained_program_state=1
use_retained_scheduling_info=1

# Modular object configuration files
cfg_file=/opt/nagios/etc/objects/commands.cfg
cfg_file=/opt/nagios/etc/objects/timeperiods.cfg
cfg_file=/opt/nagios/etc/objects/templates.cfg
cfg_file=/opt/nagios/etc/objects/contacts.cfg
cfg_file=/opt/nagios/etc/objects/hosts.cfg
cfg_file=/opt/nagios/etc/objects/services.cfg

# 5-second base interval unit for responsive local failure detection & recovery
interval_length=5

execute_service_checks=1
accept_passive_service_checks=1
execute_host_checks=1
accept_passive_host_checks=1
enable_notifications=1
enable_event_handlers=1
enable_flap_detection=1
process_performance_data=1
obsess_over_services=0
obsess_over_hosts=0
use_syslog=0
log_notifications=1
log_service_retries=1
log_host_retries=1
log_event_handlers=1
log_initial_states=0
log_current_states=1
log_external_commands=1
log_passive_checks=1
use_large_installation_tweaks=0
enable_environment_macros=0
debug_level=0
debug_verbosity=0
debug_file=/tmp/nagios4/nagios.debug
date_format=iso8601
use_timezone=UTC
illegal_macro_output_chars=`~$^&|'"<>
