# Monitored AutoHeal Infrastructure Hosts (TCP liveness avoids privileged CAP_NET_RAW ICMP)

define host {
    use         autoheal-host
    host_name   autoheal-web
    alias       AutoHeal Web Application (nginx)
    address     web
    check_command check_tcp_port!80
}

define host {
    use         autoheal-host
    host_name   autoheal-api
    alias       AutoHeal Control Plane API (FastAPI)
    address     api
    check_command check_tcp_port!8000
}

define host {
    use         autoheal-host
    host_name   autoheal-nagios
    alias       AutoHeal Nagios Core Server
    address     127.0.0.1
    check_command check_tcp_port!8081
}
