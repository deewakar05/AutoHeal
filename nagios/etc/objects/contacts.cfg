# Nagios Contacts and Contact Groups for AutoHeal Webhook Alerting

define contact {
    contact_name                    autoheal-webhook
    alias                           AutoHeal Authenticated Webhook Dispatcher
    service_notification_period     24x7
    host_notification_period        24x7
    service_notification_options    w,u,c,r,f
    host_notification_options       d,u,r,f
    service_notification_commands   notify-service-autoheal
    host_notification_commands      notify-host-autoheal
}

define contactgroup {
    contactgroup_name               autoheal-admins
    alias                           AutoHeal Operations Team
    members                         autoheal-webhook
}
