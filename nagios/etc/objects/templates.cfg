# Host and Service Templates tuned for responsive container failure detection
# Note: nagios.cfg sets interval_length=5, so interval=1 is 5s and interval=2 is 10s.

define host {
    name                            autoheal-host
    notifications_enabled           1
    event_handler_enabled           1
    flap_detection_enabled          1
    process_perf_data               1
    retain_status_information       1
    retain_nonstatus_information    1
    notification_period             24x7
    check_period                    24x7
    check_interval                  4
    retry_interval                  1
    max_check_attempts              3
    notification_interval           0
    notification_options            d,u,r,f
    contact_groups                  autoheal-admins
    register                        0
}

define service {
    name                            autoheal-service
    active_checks_enabled           1
    passive_checks_enabled          1
    parallelize_check               1
    obsess_over_service             1
    check_freshness                 0
    notifications_enabled           1
    event_handler_enabled           1
    flap_detection_enabled          1
    low_flap_threshold              20.0
    high_flap_threshold             40.0
    process_perf_data               1
    retain_status_information       1
    retain_nonstatus_information    1
    is_volatile                     0
    check_period                    24x7
    notification_period             24x7
    check_interval                  2
    retry_interval                  1
    max_check_attempts              3
    notification_interval           0
    notification_options            w,u,c,r,f
    contact_groups                  autoheal-admins
    register                        0
}
