# Check and Notification Command Definitions for AutoHeal

define command {
    command_name    check_tcp_port
    command_line    $USER1$/check_tcp -H $HOSTADDRESS$ -p $ARG1$ -t 3
}

define command {
    command_name    check_http_endpoint
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p $ARG1$ -u "$ARG2$" -t 3
}

define command {
    command_name    check_http_expected
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p $ARG1$ -u "$ARG2$" -e "$ARG3$" -t 3
}

define command {
    command_name    check_nrpe_cmd
    command_line    $USER1$/check_nrpe -H $HOSTADDRESS$ -p 5666 -t 5 -c "$ARG1$"
}

# Never pass secrets on command lines; nagios_notify.py loads AUTOHEAL_NAGIOS_WEBHOOK_SECRET from protected env/0600 file.
define command {
    command_name    notify-host-autoheal
    command_line    /usr/bin/python3 $USER2$/nagios_notify.py --kind host --notification-type "$NOTIFICATIONTYPE$" --host-name "$HOSTNAME$" --state "$HOSTSTATE$" --state-type "$HOSTSTATETYPE$" --attempt "$HOSTATTEMPT$" --max-attempts "$MAXHOSTATTEMPTS$" --output "$HOSTOUTPUT$" --timestamp "$TIMET$" --problem-id "$HOSTPROBLEMID$" --last-problem-id "$LASTHOSTPROBLEMID$" --notification-id "$HOSTNOTIFICATIONID$" --notification-number "$HOSTNOTIFICATIONNUMBER$"
}

define command {
    command_name    notify-service-autoheal
    command_line    /usr/bin/python3 $USER2$/nagios_notify.py --kind service --notification-type "$NOTIFICATIONTYPE$" --host-name "$HOSTNAME$" --service-name "$SERVICEDESC$" --state "$SERVICESTATE$" --state-type "$SERVICESTATETYPE$" --attempt "$SERVICEATTEMPT$" --max-attempts "$MAXSERVICEATTEMPTS$" --output "$SERVICEOUTPUT$" --timestamp "$TIMET$" --problem-id "$SERVICEPROBLEMID$" --last-problem-id "$LASTSERVICEPROBLEMID$" --notification-id "$SERVICENOTIFICATIONID$" --notification-number "$SERVICENOTIFICATIONNUMBER$"
}
