# Active HTTP Service Checks Monitored by Nagios Core

define service {
    use                 autoheal-service
    host_name           autoheal-web
    service_description Web HTTP Health
    check_command       check_http_endpoint!80!/health
    check_interval      1
    retry_interval      1
    max_check_attempts  3
}

define service {
    use                 autoheal-service
    host_name           autoheal-api
    service_description API Health
    check_command       check_http_endpoint!8000!/health
}

# Self-check verifying Apache + Basic Auth enforcement on Nagios UI
define service {
    use                 autoheal-service
    host_name           autoheal-nagios
    service_description Nagios Web UI Auth
    check_command       check_http_expected!8081!/nagios4/!401
}
