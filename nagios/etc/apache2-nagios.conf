# Hardened Apache VirtualHost for Nagios Core UI & CGIs on non-privileged port 8081

ServerTokens Prod
ServerSignature Off
ServerName localhost
DefaultRuntimeDir /tmp/apache2
PidFile /tmp/apache2/apache2.pid
Mutex pthread

<VirtualHost *:8081>
    DocumentRoot /usr/share/nagios4/htdocs

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined

    ScriptAlias /cgi-bin/nagios4 /usr/lib/cgi-bin/nagios4
    ScriptAlias /nagios4/cgi-bin /usr/lib/cgi-bin/nagios4
    Alias /nagios4/stylesheets /etc/nagios4/stylesheets
    Alias /nagios4 /usr/share/nagios4/htdocs

    RedirectMatch ^/$ /nagios4/

    <DirectoryMatch (/usr/share/nagios4/htdocs|/usr/lib/cgi-bin/nagios4|/etc/nagios4/stylesheets)>
        Options FollowSymLinks
        DirectoryIndex index.php index.html
        AllowOverride None

        SetEnv NAGIOS_CGI_CONFIG /tmp/nagios-cfg/cgi.cfg

        AuthType Basic
        AuthName "AutoHeal Nagios Monitoring"
        AuthBasicProvider file
        AuthUserFile "/tmp/nagios-secrets/htpasswd"
        Require valid-user
    </DirectoryMatch>
</VirtualHost>
